<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cargando personaje...</title>
  <script>
    const path = window.location.pathname.replace(/^\/+/,'').replace(/\/+$/,'');
    if (path && !path.includes('.html')) {
      window.location.replace('/character.html?c=' + encodeURIComponent(path));
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body style="background:#101014; color:#8a8a92; font-family:sans-serif; text-align:center; padding-top:80px;">
  Cargando...
</body>
</html>
