<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Personaje — Neverness to Everness</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@400;500;600;700&display=swap');

  :root{
    --bg: #101014;
    --panel: #17171d;
    --line: #2b2b33;
    --ink: #f2f1ec;
    --dim: #8a8a92;
    --accent: #e0b872;
    --char-accent: var(--accent);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Archivo', sans-serif;
    min-height: 100vh;
  }

  header{
    border-bottom: 1px solid var(--line);
    padding: 22px 24px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap: 10px;
  }
  header .mark{ font-family:'Archivo Black', sans-serif; font-size: 18px; letter-spacing: -0.01em; }
  header .mark span{ color: var(--dim); font-weight:400; font-family:'IBM Plex Mono', monospace; font-size: 13px; margin-left: 8px; }
  #backBtn{
    background:none; border: 1px solid var(--line); color: var(--ink);
    font-family:'IBM Plex Mono', monospace; font-size: 12px;
    padding: 8px 14px; cursor:pointer; text-decoration:none;
    display:inline-block;
  }
  #backBtn:hover{ border-color: var(--ink); }

  main{ max-width: 1120px; margin: 0 auto; padding: 30px 20px 80px; }

  .detail-head{
    display:flex;
    align-items:center;
    gap: 18px;
    padding-bottom: 22px;
    margin-bottom: 26px;
    border-bottom: 1px solid var(--line);
  }
  .detail-head .portrait{
    width: 90px; height: 90px;
    border: 3px solid var(--char-accent);
    box-shadow: 0 0 16px rgba(0,0,0,0.6), 0 0 10px var(--char-accent);
    flex-shrink:0;
    overflow:hidden;
    position:relative;
    background: var(--panel);
  }
  .detail-head .portrait img{ width:100%; height:100%; object-fit:cover; object-position: top center; }
  .detail-head .portrait .fallback{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Archivo Black', sans-serif; font-size: 40px; color: var(--char-accent);
  }
  .detail-head h1{ font-size: 26px; font-weight: 700; display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
  .detail-head .sub{ font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--dim); margin-top: 4px; }

  .rank-badge{ width:22px; height:22px; vertical-align: middle; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
  .phase-tag-detail{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    font-weight:600;
    padding: 2px 8px;
    margin-left: 6px;
    border: 1px solid var(--char-accent);
    color: var(--char-accent);
    background: rgba(16,16,20,0.85);
  }

  .cols{ display:grid; grid-template-columns: 1fr 1.3fr; gap: 22px; }
  @media (max-width: 760px){ .cols{ grid-template-columns: 1fr; } }

  .block{ border: 1px solid var(--line); padding: 20px; background: var(--panel); }
  .block h2{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--dim);
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  .gift-row{
    display:flex; justify-content:space-between; align-items:center;
    gap: 12px;
    padding: 12px 10px; border-top: 1px solid var(--line); font-size: 12.5px;
    cursor:pointer;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .gift-row:first-child{ border-top:none; }
  .gift-row:hover{ background: rgba(255,255,255,0.04); }
  .gift-row.active{
    background: rgba(255, 255, 255, 0.07);
    border-left: 3px solid var(--char-accent);
    padding-left: 14px;
  }
  .gift-row .gimg{ width:36px; height:36px; object-fit:contain; flex-shrink:0; background:var(--bg); border:1px solid var(--line); padding:2px; }
  .gift-row .gname{ flex:1; font-weight:600; }
  .gift-row .gname .active-badge{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    color: var(--char-accent);
    margin-left:6px;
  }
  .gift-row .gneed{ display:block; font-size:10.5px; color:var(--dim); font-weight:400; margin-top:3px; }
  .gift-row .gval{ font-family:'IBM Plex Mono', monospace; color: var(--char-accent); font-weight:600; font-size: 12px; white-space:nowrap; text-align:right; }

  .field{ margin-bottom: 16px; }
  .field label{ display:block; font-size: 12px; color: var(--dim); margin-bottom: 5px; }
  .field input, .field select{
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 11px;
    font-size: 14px;
    font-family: 'Archivo', sans-serif;
  }
  .field input:focus, .field select:focus{ outline:none; border-color: var(--char-accent); }

  .toggle{ display:flex; gap: 10px; align-items:flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
  .toggle:first-child{ border-top:none; padding-top:0; }
  .toggle input{ margin-top:3px; width:16px; height:16px; accent-color: var(--char-accent); }
  .toggle strong{ display:block; font-size: 13px; }
  .toggle span{ font-size: 11.5px; color: var(--dim); }

  .results{ border-color: var(--char-accent); }
  .big-stat{ font-family:'Archivo Black', sans-serif; font-size: 46px; color: var(--char-accent); line-height: 1; }
  .big-stat + .lbl{ font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--dim); margin-top: 6px; margin-bottom: 20px; }

  .stat3{ display:grid; grid-template-columns: repeat(3,1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 20px; }
  .stat3 .cell{ background: var(--bg); padding: 12px; }
  .stat3 .cell .n{ font-size: 18px; font-weight:700; }
  .stat3 .cell .l{ font-family:'IBM Plex Mono', monospace; font-size: 10px; color: var(--dim); margin-top: 3px; }

  table{ width:100%; border-collapse:collapse; font-size: 12.5px; }
  th{ text-align:left; font-family:'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--dim); font-weight:500; padding: 7px 6px; border-bottom: 1px solid var(--line); }
  td{ padding: 7px 6px; border-bottom: 1px solid var(--line); }

  .complete{ font-family:'Archivo Black', sans-serif; font-size: 22px; color: var(--char-accent); padding: 10px 0; }
</style>
</head>

  // Extrae el color representativo más saturado analizando los píxeles directamente
  function extractAccentFromUrl(imageUrl, slug, onColor){
    const cacheKey = `nte_accent_${slug}`;
    const cached = sessionStorage.getItem(cacheKey);
    if(cached){
      onColor(cached);
      return;
    }

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.referrerPolicy = "no-referrer";

    const proxyUrl = "https://wsrv.nl/?url=" + encodeURIComponent(imageUrl.replace(/^https?:\/\//, '')) + "&w=48&h=48&output=webp";
    img.src = proxyUrl;

    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = 40;
        canvas.height = 40;
        ctx.drawImage(img, 0, 0, 40, 40);
        const { data } = ctx.getImageData(0, 0, 40, 40);

        let bestR = 224, bestG = 184, bestB = 114;
        let maxScore = -1;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
          if (a < 128) continue;

          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          const lum = (max + min) / 510;
          if (lum < 0.16 || lum > 0.86) continue;

          const delta = max - min;
          const sat = (lum > 0.5) ? delta / (510 - max - min) : delta / (max + min);
          if (sat < 0.25) continue;

          const score = sat * (1 - Math.abs(lum - 0.55));
          if (score > maxScore) {
            maxScore = score;
            bestR = r; bestG = g; bestB = b;
          }
        }

        if (maxScore > 0) {
          const rgb = `rgb(${bestR}, ${bestG}, ${bestB})`;
          sessionStorage.setItem(cacheKey, rgb);
          onColor(rgb);
        }
      } catch(e) {}
    };
  }

  async function init(){
    const params = new URLSearchParams(window.location.search);
    let target = params.get('c');
    if(!target){
      const parts = window.location.pathname.split('/').filter(Boolean);
      target = decodeURIComponent(parts[parts.length - 1] || '');
    }

    try {
      const [cRes, gRes] = await Promise.all([fetch('characters.json'), fetch('gifts.json')]);
      const characters = await cRes.json();
      GIFTS = await gRes.json();

      character = characters.find(c => 
        c.name.toLowerCase() === target.toLowerCase() || 
        c.slug.toLowerCase() === target.toLowerCase()
      ) || characters[0];

      window.history.replaceState({}, '', '/' + encodeURIComponent(character.name));

      // Extraer color directamente de la imagen del personaje
      const charImgUrl = `${CHAR_CDN}${character.slug}_card.webp`;
      extractAccentFromUrl(charImgUrl, character.slug, (color) => {
        document.documentElement.style.setProperty('--char-accent', color);
      });

      renderDetail();
    } catch(err) {
      document.getElementById('mainContent').innerHTML = `
        <div style="text-align:center; padding: 40px;">
          <h2 style="color:var(--accent);">Error al cargar datos</h2>
          <p style="color:var(--dim); margin-top:10px;">No se pudieron obtener characters.json o gifts.json.</p>
        </div>
      `;
    }
  }

  function renderDetail(){
    const c = character;
    const items = giftsOf(c);
    activeGiftId = items[0] ? items[0].id : null;

    document.title = `${c.name} — Bond Neverness to Everness`;

    const main = document.getElementById('mainContent');
    main.innerHTML = `
      <div class="detail-head">
        <div class="portrait">
          <img src="${CHAR_CDN}${c.slug}_card.webp" alt="${c.name}" referrerpolicy="no-referrer"
               onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'fallback',textContent:'${initials(c.name)}'}))">
        </div>
        <div>
          <h1>
            ${c.name}
            <img class="rank-badge" src="${rankIcon(c.rank)}" alt="Rango ${c.rank || 'A'}" referrerpolicy="no-referrer">
            ${c.tag ? `<span class="phase-tag-detail">${c.tag}</span>` : ''}
          </h1>
          <div class="sub" id="headerSub">Calculando progreso...</div>
        </div>
      </div>

      <div class="cols">
        <div>
          <div class="block" style="margin-bottom:22px;">
            <h2>Regalos disponibles (haz clic para seleccionar)</h2>
            <div id="giftList"></div>
          </div>

          <div class="block">
            <h2>Configuración de Progreso</h2>
            <div class="field">
              <label>Nivel de bond actual</label>
              <select id="curLevel"></select>
            </div>
            <div class="field">
              <label>Afinidad ya obtenida en el nivel actual</label>
              <input type="number" id="curXp" min="0" value="0">
            </div>
            <div class="field">
              <label>Fons por unidad</label>
              <input type="number" id="fonsPerItem" min="0" value="0">
            </div>
            <div class="field">
              <label>Regalos / día a este personaje</label>
              <input type="number" id="giftsPerDay" min="1" max="3" value="3">
            </div>
            <div class="toggle">
              <input type="checkbox" id="appraiser">
              <div><strong>Perito/a</strong><span>+5% afinidad por regalo hasta nivel de bond 8</span></div>
            </div>
            <div class="toggle">
              <input type="checkbox" id="dailyAction">
              <div><strong>Acción / Salida diaria (nivel 7+)</strong><span>+200 afinidad/día fija sin coste de regalo</span></div>
            </div>
          </div>
        </div>

        <div class="block results" id="resultsBlock">
          <h2>Resultado</h2>
          <div id="resultsBody"></div>
        </div>
      </div>
    `;

    const curLevelSel = document.querySelector('#curLevel');
    for(let l=1; l<=9; l++){
      const opt = document.createElement('option');
      opt.value = l; opt.textContent = `Nivel ${l}`;
      curLevelSel.appendChild(opt);
    }
    curLevelSel.value = 1;

    const els = {
      curLevel: curLevelSel,
      curXp: document.querySelector('#curXp'),
      fonsPerItem: document.querySelector('#fonsPerItem'),
      giftsPerDay: document.querySelector('#giftsPerDay'),
      appraiser: document.querySelector('#appraiser'),
      dailyAction: document.querySelector('#dailyAction'),
      giftList: document.querySelector('#giftList'),
      headerSub: document.querySelector('#headerSub'),
    };

    function updateFonsDefault(){
      const chosen = items.find(it => it.id === activeGiftId) || items[0];
      els.fonsPerItem.value = (chosen && chosen.fons) ? chosen.fons : 0;
    }
    updateFonsDefault();

    function calculateWithGift(giftObj){
      const curLevel = parseInt(els.curLevel.value, 10);
      let curXp = Math.max(0, parseInt(els.curXp.value || '0', 10));
      const giftsPerDay = Math.max(1, parseInt(els.giftsPerDay.value || '1', 10));
      const hasAppraiser = els.appraiser.checked;
      const hasDailyAction = els.dailyAction.checked;
      const baseGiftValue = giftObj.value;

      const segmentNeed = thresholds[curLevel - 1] || 0;
      if(curXp > segmentNeed) curXp = segmentNeed;

      let segs = [];
      for(let lvl = curLevel; lvl <= 9; lvl++){
        const need = thresholds[lvl - 1];
        const already = (lvl === curLevel) ? curXp : 0;
        const remaining = Math.max(0, need - already);
        const bonusApplies = hasAppraiser && (lvl <= 8);
        const eff = bonusApplies ? Math.round(baseGiftValue * 1.05) : baseGiftValue;
        segs.push({ lvl, need, remaining, bonusApplies, eff, used: 0 });
      }

      let days = 0, itemsUsed = 0, si = 0;
      while(si < segs.length && days < 20000){
        days++;
        if(hasDailyAction && si < segs.length){
          segs[si].remaining -= 200;
          if(segs[si].remaining <= 0) si++;
        }
        let sent = 0;
        while(sent < giftsPerDay && si < segs.length){
          const s = segs[si];
          s.remaining -= s.eff;
          s.used++; itemsUsed++; sent++;
          if(s.remaining <= 0){ si++; }
        }
        if(si >= segs.length) break;
      }

      return { curLevel, segs, items: itemsUsed, days, giftsPerDay };
    }

    function render(){
      const currentGift = items.find(it => it.id === activeGiftId) || items[0];
      const r = calculateWithGift(currentGift);

      els.headerSub.textContent = `Regalo seleccionado: ${currentGift.gift} · +${currentGift.value} afinidad`;

      // Renderizado de lista interactiva (selección exclusiva por clic en la fila)
      els.giftList.innerHTML = items.map(it => {
        const itemCalc = calculateWithGift(it);
        const isActive = it.id === activeGiftId;
        return `
          <div class="gift-row ${isActive ? 'active' : ''}" data-id="${it.id}">
            <img class="gimg" src="${it.icon}" referrerpolicy="no-referrer" onerror="this.src='${FALLBACK_ICON}'">
            <span class="gname">
              ${it.gift} ${isActive ? '<span class="active-badge">● SELECCIONADO</span>' : ''}
              <span class="gneed">${itemCalc.items.toLocaleString()} unidades · ~${itemCalc.days.toLocaleString()} días requeridos</span>
            </span>
            <span class="gval">
              +${it.value} af.
              ${it.fons ? '<br><span style="font-size:10.5px; color:var(--dim); font-weight:400;">' + it.fons.toLocaleString() + ' fons</span>' : ''}
            </span>
          </div>
        `;
      }).join('');

      els.giftList.querySelectorAll('.gift-row').forEach(row => {
        row.addEventListener('click', () => {
          activeGiftId = row.dataset.id;
          updateFonsDefault();
          render();
        });
      });

      const body = document.querySelector('#resultsBody');
      if(r.curLevel >= 10){
        body.innerHTML = `<div class="complete">BOND 10 ALCANZADO</div>`;
        return;
      }
      const fons = Math.max(0, parseFloat(els.fonsPerItem.value || '0'));
      const totalFons = r.items * fons;

      const rows = r.segs.map(s => `
        <tr>
          <td>${s.lvl} → ${s.lvl+1}</td>
          <td>${s.need.toLocaleString()}</td>
          <td>${s.bonusApplies ? '+5%' : '—'}</td>
          <td>${s.used.toLocaleString()}</td>
        </tr>`).join('');

      body.innerHTML = `
        <div class="big-stat">${r.items.toLocaleString()}</div>
        <div class="lbl">unidades de ${currentGift.gift}</div>
        <div class="stat3">
          <div class="cell"><div class="n">${totalFons.toLocaleString()}</div><div class="l">fons totales</div></div>
          <div class="cell"><div class="n">${r.days.toLocaleString()}</div><div class="l">días estimados</div></div>
          <div class="cell"><div class="n">${r.giftsPerDay}</div><div class="l">regalos/día</div></div>
        </div>
        <table>
          <thead><tr><th>Nivel</th><th>Afinidad</th><th>Bonus</th><th>Items</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    [els.curLevel, els.curXp, els.fonsPerItem, els.giftsPerDay, els.appraiser, els.dailyAction].forEach(el => {
      el.addEventListener('input', render);
      el.addEventListener('change', render);
    });

    render();
  }

  init();
</script>
</body>
</html>
