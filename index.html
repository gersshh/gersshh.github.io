<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Bond — Neverness to Everness</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@400;500;600;700&display=swap');

  :root{
    --bg: #101014;
    --panel: #17171d;
    --line: #2b2b33;
    --ink: #f2f1ec;
    --dim: #8a8a92;
    --accent: #e0b872;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Archivo', sans-serif;
    min-height: 100vh;
  }

  header{
    border-bottom: 1px solid var(--line);
    padding: 22px 24px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap: 10px;
  }
  header .mark{ font-family:'Archivo Black', sans-serif; font-size: 18px; letter-spacing: -0.01em; }
  header .mark span{ color: var(--dim); font-weight:400; font-family:'IBM Plex Mono', monospace; font-size: 13px; margin-left: 8px; }

  main{ max-width: 1120px; margin: 0 auto; padding: 30px 20px 80px; }

  .grid{
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
  }
  @media (max-width: 980px){ .grid{ grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 620px){ .grid{ grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 420px){ .grid{ grid-template-columns: repeat(2, 1fr); } }

  .char-tile{
    background: var(--panel);
    aspect-ratio: 3/4;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    border: 2px solid var(--line);
    text-decoration: none;
    color: inherit;
    --char-accent: var(--accent);
    transition: border-color .25s ease, transform .15s ease, box-shadow .25s ease;
  }
  .char-tile:hover{
    transform: translateY(-4px);
    border-color: var(--char-accent);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), 0 0 14px var(--char-accent);
  }
  .char-tile:hover .tile-img{ filter: brightness(1.08) saturate(1.05); }
  .tile-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: cover;
    object-position: top center;
    transition: filter .2s ease;
  }
  .tile-fallback{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Archivo Black', sans-serif;
    font-size: 34px;
    color: var(--char-accent);
    background: var(--panel);
  }
  .tile-caption{
    position:relative; z-index:2;
    background: linear-gradient(to top, rgba(0,0,0,0.92) 35%, transparent);
    padding: 24px 10px 10px;
    width:100%;
  }
  .char-tile .cname{ font-size: 13px; font-weight: 700; line-height: 1.15; }

  .rank-badge{
    position:absolute; top:8px; right:8px; z-index:3;
    width:26px; height:26px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.6));
  }
  .phase-tag{
    position:absolute; top:8px; left:8px; z-index:3;
    font-family:'IBM Plex Mono', monospace;
    font-size: 9.5px;
    font-weight:600;
    letter-spacing: 0.02em;
    padding: 3px 6px;
    background: rgba(16, 16, 20, 0.88);
    border: 1px solid var(--char-accent);
    color: var(--char-accent);
    backdrop-filter: blur(4px);
  }
  .char-tile[data-rank="S"]{
    background:
      radial-gradient(circle at 70% 20%, rgba(255,196,64,0.22), transparent 60%),
      radial-gradient(circle at 20% 80%, rgba(255,90,160,0.18), transparent 60%),
      var(--panel);
  }
  .char-tile[data-rank="A"]{
    background:
      radial-gradient(circle at 75% 15%, rgba(220,80,220,0.16), transparent 60%),
      radial-gradient(circle at 15% 85%, rgba(90,140,255,0.12), transparent 60%),
      var(--panel);
  }
</style>
</head>
<body>

<header>
  <div class="mark">BOND<span>neverness to everness</span></div>
</header>

<main>
  <div class="grid" id="charGrid"></div>
</main>

  function rankIcon(r){ return r === "S" ? RANK_ICON_S : RANK_ICON_A; }
  function initials(name){ return name.trim()[0].toUpperCase(); }

  // Extrae el color representativo más saturado analizando los píxeles directamente
  function extractAccentFromUrl(imageUrl, slug, onColor){
    const cacheKey = `nte_accent_${slug}`;
    const cached = sessionStorage.getItem(cacheKey);
    if(cached){
      onColor(cached);
      return;
    }

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.referrerPolicy = "no-referrer";

    // Usamos el proxy CORS de wsrv.nl para evitar el canvas taint por restricciones de origen
    const proxyUrl = "https://wsrv.nl/?url=" + encodeURIComponent(imageUrl.replace(/^https?:\/\//, '')) + "&w=48&h=48&output=webp";
    img.src = proxyUrl;

    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = 40;
        canvas.height = 40;
        ctx.drawImage(img, 0, 0, 40, 40);
        const { data } = ctx.getImageData(0, 0, 40, 40);

        let bestR = 224, bestG = 184, bestB = 114;
        let maxScore = -1;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
          if (a < 128) continue;

          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          const lum = (max + min) / 510;
          if (lum < 0.16 || lum > 0.86) continue;

          const delta = max - min;
          const sat = (lum > 0.5) ? delta / (510 - max - min) : delta / (max + min);
          if (sat < 0.25) continue;

          const score = sat * (1 - Math.abs(lum - 0.55));
          if (score > maxScore) {
            maxScore = score;
            bestR = r; bestG = g; bestB = b;
          }
        }

        if (maxScore > 0) {
          const rgb = `rgb(${bestR}, ${bestG}, ${bestB})`;
          sessionStorage.setItem(cacheKey, rgb);
          onColor(rgb);
        }
      } catch(e) {}
    };
  }

  async function loadGrid(){
    try {
      const res = await fetch('characters.json');
      const characters = await res.json();
      const grid = document.getElementById('charGrid');
      grid.innerHTML = characters.map(c => `
        <a class="char-tile" href="character.html?c=${encodeURIComponent(c.name)}" data-rank="${c.rank || 'A'}" data-slug="${c.slug}">
          ${c.tag ? `<span class="phase-tag">${c.tag}</span>` : ''}
          <img class="rank-badge" src="${rankIcon(c.rank)}" alt="Rango ${c.rank || 'A'}" referrerpolicy="no-referrer">
          <img class="tile-img" src="${CHAR_CDN}${c.slug}_card.webp" alt="${c.name}" referrerpolicy="no-referrer"
               onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'tile-fallback',textContent:'${initials(c.name)}'}))">
          <div class="tile-caption">
            <div class="cname">${c.name}</div>
          </div>
        </a>
      `).join('');

      // Extracción de acento en tiempo de ejecución para cada carta
      grid.querySelectorAll('.char-tile').forEach(tile => {
        const slug = tile.dataset.slug;
        const imgUrl = `${CHAR_CDN}${slug}_card.webp`;
        extractAccentFromUrl(imgUrl, slug, (color) => {
          tile.style.setProperty('--char-accent', color);
        });
      });
    } catch(err) {
      console.error(err);
    }
  }

  loadGrid();
</script>
</body>
</html>
