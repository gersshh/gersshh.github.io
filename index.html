<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Bond — Neverness to Everness</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@400;500;600;700&display=swap');

  :root{
    --bg: #101014;
    --panel: #17171d;
    --line: #2b2b33;
    --ink: #f2f1ec;
    --dim: #8a8a92;
    --accent: #e0b872;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Archivo', sans-serif;
    min-height: 100vh;
  }

  header{
    border-bottom: 1px solid var(--line);
    padding: 22px 24px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap: 10px;
  }
  header .mark{ font-family:'Archivo Black', sans-serif; font-size: 18px; letter-spacing: -0.01em; }
  header .mark span{ color: var(--dim); font-weight:400; font-family:'IBM Plex Mono', monospace; font-size: 13px; margin-left: 8px; }
  #backBtn{
    background:none; border: 1px solid var(--line); color: var(--ink);
    font-family:'IBM Plex Mono', monospace; font-size: 12px;
    padding: 8px 14px; cursor:pointer; display:none;
  }
  #backBtn:hover{ border-color: var(--ink); }

  main{ max-width: 1120px; margin: 0 auto; padding: 30px 20px 80px; }

  /* ---- error / file picker state ---- */
  .error-box{
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 30px;
    max-width: 650px;
    margin: 40px auto;
    text-align: center;
  }
  .error-box h2{
    font-family: 'Archivo Black', sans-serif;
    font-size: 20px;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .error-box p{
    font-size: 13px;
    color: var(--dim);
    line-height: 1.6;
    margin-bottom: 20px;
  }
  .error-box code{
    font-family: 'IBM Plex Mono', monospace;
    background: var(--bg);
    padding: 2px 6px;
    border: 1px solid var(--line);
    color: var(--ink);
  }
  .btn-upload{
    display: inline-block;
    background: var(--accent);
    color: #101014;
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 12px 22px;
    border: none;
    cursor: pointer;
    transition: opacity .15s ease;
  }
  .btn-upload:hover{ opacity: 0.9; }

  /* ---- home grid ---- */
  #home .grid{
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
  }
  @media (max-width: 980px){ #home .grid{ grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 620px){ #home .grid{ grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 420px){ #home .grid{ grid-template-columns: repeat(2, 1fr); } }

  .char-tile{
    background: var(--panel);
    aspect-ratio: 3/4;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    border: 2px solid var(--line);
    transition: border-color .25s ease, transform .15s ease;
  }
  .char-tile:hover{
    transform: translateY(-3px);
    border-color: var(--accent);
  }
  .char-tile:hover .tile-img{ filter: brightness(1.08) saturate(1.05); }
  .tile-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: cover;
    object-position: top center;
    transition: filter .2s ease;
  }
  .tile-fallback{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Archivo Black', sans-serif;
    font-size: 34px;
    color: var(--accent);
    background: var(--panel);
  }
  .tile-caption{
    position:relative; z-index:2;
    background: linear-gradient(to top, rgba(0,0,0,0.88) 35%, transparent);
    padding: 24px 10px 8px;
    width:100%;
  }
  .char-tile .cname{ font-size: 13px; font-weight: 700; line-height: 1.15; }

  .rank-badge{
    position:absolute; top:8px; right:8px; z-index:3;
    width:26px; height:26px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.6));
  }
  .phase-tag{
    position:absolute; top:8px; left:8px; z-index:3;
    font-family:'IBM Plex Mono', monospace;
    font-size: 9.5px;
    font-weight:600;
    letter-spacing: 0.02em;
    padding: 3px 6px;
    background: rgba(16, 16, 20, 0.85);
    border: 1px solid var(--accent);
    color: var(--accent);
    backdrop-filter: blur(4px);
  }
  .phase-tag-detail{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight:600;
    padding: 2px 7px;
    margin-left: 8px;
    border: 1px solid var(--accent);
    color: var(--accent);
    vertical-align: middle;
  }

  .char-tile[data-rank="S"]{
    background:
      radial-gradient(circle at 70% 20%, rgba(255,196,64,0.35), transparent 60%),
      radial-gradient(circle at 20% 80%, rgba(255,90,160,0.28), transparent 60%),
      var(--panel);
  }
  .char-tile[data-rank="A"]{
    background:
      radial-gradient(circle at 75% 15%, rgba(220,80,220,0.22), transparent 60%),
      radial-gradient(circle at 15% 85%, rgba(90,140,255,0.16), transparent 60%),
      var(--panel);
  }
  .detail-head{ position:relative; }
  .detail-head .rank-badge{
    position:static;
    width:22px; height:22px;
    margin-left:8px;
    vertical-align: middle;
  }
  .detail-head h1{ display:flex; align-items:center; flex-wrap:wrap; gap:4px; }

  /* ---- detail page ---- */
  #detail{ display:none; }

  .detail-head{
    display:flex;
    align-items:center;
    gap: 18px;
    padding-bottom: 22px;
    margin-bottom: 26px;
    border-bottom: 1px solid var(--line);
  }
  .detail-head .portrait{
    width: 90px; height: 90px;
    border: 3px solid var(--accent);
    flex-shrink:0;
    overflow:hidden;
    position:relative;
  }
  .detail-head .portrait img{ width:100%; height:100%; object-fit:cover; object-position: top center; }
  .detail-head .portrait .fallback{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Archivo Black', sans-serif; font-size: 40px; color: var(--accent);
  }
  .detail-head h1{ font-size: 26px; font-weight: 700; }
  .detail-head .sub{ font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--dim); margin-top: 4px; }

  .cols{ display:grid; grid-template-columns: 1fr 1.3fr; gap: 22px; }
  @media (max-width: 760px){ .cols{ grid-template-columns: 1fr; } }

  .block{ border: 1px solid var(--line); padding: 20px; }
  .block h2{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--dim);
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  .field{ margin-bottom: 16px; }
  .field label{ display:block; font-size: 12px; color: var(--dim); margin-bottom: 5px; }
  .field input, .field select{
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 11px;
    font-size: 14px;
    font-family: 'Archivo', sans-serif;
  }
  .field input:focus, .field select:focus{ outline:none; border-color: var(--accent); }

  .toggle{ display:flex; gap: 10px; align-items:flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
  .toggle:first-child{ border-top:none; padding-top:0; }
  .toggle input{ margin-top:3px; width:16px; height:16px; accent-color: var(--accent); }
  .toggle strong{ display:block; font-size: 13px; }
  .toggle span{ font-size: 11.5px; color: var(--dim); }

  .gift-row{
    display:flex; justify-content:space-between; align-items:center;
    gap: 10px;
    padding: 10px 8px; border-top: 1px solid var(--line); font-size: 12.5px;
    cursor:pointer;
    transition: background-color .15s ease;
  }
  .gift-row:first-child{ border-top:none; }
  .gift-row:hover{ background: rgba(255,255,255,0.03); }
  .gift-row.active{
    background: rgba(224, 184, 114, 0.12);
    border-left: 2px solid var(--accent);
  }
  .gift-row .gimg{ width:32px; height:32px; object-fit:cover; flex-shrink:0; background:var(--bg); border:1px solid var(--line); }
  .gift-row .gname{ flex:1; font-weight:500; }
  .gift-row .gval{ font-family:'IBM Plex Mono', monospace; color: var(--accent); font-weight:600; font-size: 12px; white-space:nowrap; text-align:right; }
  .gift-row .gneed{ display:block; font-size:10.5px; color:var(--dim); font-weight:400; margin-top:2px; }

  .results{ border-color: var(--accent); }
  .big-stat{ font-family:'Archivo Black', sans-serif; font-size: 46px; color: var(--accent); line-height: 1; }
  .big-stat + .lbl{ font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--dim); margin-top: 6px; margin-bottom: 20px; }

  .stat3{ display:grid; grid-template-columns: repeat(3,1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 20px; }
  .stat3 .cell{ background: var(--bg); padding: 12px; }
  .stat3 .cell .n{ font-size: 18px; font-weight:700; }
  .stat3 .cell .l{ font-family:'IBM Plex Mono', monospace; font-size: 10px; color: var(--dim); margin-top: 3px; }

  table{ width:100%; border-collapse:collapse; font-size: 12.5px; }
  th{ text-align:left; font-family:'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--dim); font-weight:500; padding: 7px 6px; border-bottom: 1px solid var(--line); }
  td{ padding: 7px 6px; border-bottom: 1px solid var(--line); }

  .complete{ font-family:'Archivo Black', sans-serif; font-size: 22px; color: var(--accent); padding: 10px 0; }
</style>
</head>
<body>

<header>
  <div class="mark">BOND<span>neverness to everness</span></div>
  <button id="backBtn">← volver</button>
</header>

<main>
  <div id="home">
    <div class="grid" id="charGrid"></div>
  </div>
  <div id="detail"></div>
</main>

  const FALLBACK_ICON = "data:image/svg+xml;utf8," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" fill="#17171d"/><path d="M16 6l3 6h6l-5 4 2 6-6-4-6 4 2-6-5-4h6z" fill="#e0b872"/></svg>`
  );

  let characters = [];
  let GIFTS = {};
  let activeGiftId = null;

  function initials(name){ return name.trim()[0].toUpperCase(); }

  function resolveGift(entry){
    const g = GIFTS[entry.id];
    if(!g) return { id: entry.id, gift: entry.id, value: 100, fons: 300, icon: FALLBACK_ICON };
    return { id: entry.id, gift: g.name, value: g.value, fons: g.fons, icon: g.icon };
  }

  function giftsOf(c){
    if(c.gifts && c.gifts.length) return c.gifts.map(resolveGift);
    return [];
  }

  const charGrid = document.getElementById('charGrid');
  const homeEl = document.getElementById('home');
  const detailEl = document.getElementById('detail');
  const backBtn = document.getElementById('backBtn');

  function showFetchErrorUI(){
    homeEl.innerHTML = `
      <div class="error-box">
        <h2>Archivos JSON no accesibles por CORS</h2>
        <p>Al abrir el HTML haciendo doble clic directo (<code>file://</code>), los navegadores bloquean <code>fetch()</code> por seguridad.</p>
        <p>Selecciona los archivos <code>characters.json</code> y <code>gifts.json</code> de tu carpeta para cargarlos al instante (se guardarán en tu navegador):</p>
        <input type="file" id="localFilesInput" multiple accept=".json" style="display:none">
        <button class="btn-upload" onclick="document.getElementById('localFilesInput').click()">Cargar characters.json y gifts.json</button>
      </div>
    `;

    document.getElementById('localFilesInput').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      for(const f of files){
        const text = await f.text();
        if(f.name.includes('character')){
          characters = JSON.parse(text);
          localStorage.setItem('nte_characters', text);
        } else if(f.name.includes('gift')){
          GIFTS = JSON.parse(text);
          localStorage.setItem('nte_gifts', text);
        }
      }
      if(characters.length && Object.keys(GIFTS).length){
        homeEl.innerHTML = '<div class="grid" id="charGrid"></div>';
        renderGrid();
      } else {
        alert('Por favor selecciona ambos archivos: characters.json y gifts.json');
      }
    });
  }

  async function loadData(){
    const cachedC = localStorage.getItem('nte_characters');
    const cachedG = localStorage.getItem('nte_gifts');
    if(cachedC && cachedG){
      try{
        characters = JSON.parse(cachedC);
        GIFTS = JSON.parse(cachedG);
        renderGrid();
      }catch(e){}
    }

    try {
      const [cRes, gRes] = await Promise.all([fetch('characters.json'), fetch('gifts.json')]);
      if(!cRes.ok || !gRes.ok) throw new Error('HTTP status != 200');
      characters = await cRes.json();
      GIFTS = await gRes.json();
      localStorage.setItem('nte_characters', JSON.stringify(characters));
      localStorage.setItem('nte_gifts', JSON.stringify(GIFTS));
      renderGrid();
    } catch(err) {
      if(!characters.length || !Object.keys(GIFTS).length){
        showFetchErrorUI();
      }
    }
  }

  function renderGrid(){
    const grid = document.getElementById('charGrid');
    if(!grid) return;
    grid.innerHTML = characters.map((c, i) => `
      <div class="char-tile" data-i="${i}" data-rank="${c.rank || 'A'}" style="--accent:#e0b872">
        ${c.tag ? `<span class="phase-tag">${c.tag}</span>` : ''}
        <img class="rank-badge" src="${rankIcon(c.rank)}" alt="Rango ${c.rank || 'A'}" title="Rango ${c.rank || 'A'}" referrerpolicy="no-referrer">
        <img class="tile-img" src="${CHAR_CDN}${c.slug}_card.webp" alt="${c.name}" referrerpolicy="no-referrer"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'tile-fallback',textContent:'${initials(c.name)}'}))">
        <div class="tile-caption">
          <div class="cname">${c.name}</div>
        </div>
      </div>
    `).join('');

    grid.querySelectorAll('.char-tile').forEach(el => {
      el.addEventListener('click', () => openDetail(+el.dataset.i));
    });
  }

  backBtn.addEventListener('click', () => {
    detailEl.style.display = 'none';
    homeEl.style.display = 'block';
    backBtn.style.display = 'none';
  });

  function openDetail(i){
    const c = characters[i];
    const items = giftsOf(c);
    activeGiftId = items[0] ? items[0].id : null;

    detailEl.style.setProperty('--accent', '#e0b872');
    detailEl.innerHTML = `
      <div class="detail-head">
        <div class="portrait">
          <img src="${CHAR_CDN}${c.slug}_card.webp" alt="${c.name}" referrerpolicy="no-referrer"
               onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'fallback',textContent:'${initials(c.name)}'}))">
        </div>
        <div>
          <h1>
            ${c.name}
            <img class="rank-badge" src="${rankIcon(c.rank)}" alt="Rango ${c.rank || 'A'}" title="Rango ${c.rank || 'A'}" referrerpolicy="no-referrer">
            ${c.tag ? `<span class="phase-tag-detail">${c.tag}</span>` : ''}
          </h1>
          <div class="sub" id="headerSub">Calculando progreso...</div>
        </div>
      </div>

      <div class="cols">
        <div>
          <div class="block" style="margin-bottom:22px;">
            <h2>Regalos disponibles (haz clic para calcular)</h2>
            <div id="giftList"></div>
          </div>

          <div class="block">
            <h2>Configuración de Progreso</h2>
            <div class="field">
              <label>Regalo seleccionado</label>
              <select id="giftSelector"></select>
            </div>
            <div class="field">
              <label>Nivel de bond actual</label>
              <select id="curLevel"></select>
            </div>
            <div class="field">
              <label>Afinidad ya obtenida en el nivel actual</label>
              <input type="number" id="curXp" min="0" value="0">
            </div>
            <div class="field">
              <label>Fons por unidad</label>
              <input type="number" id="fonsPerItem" min="0" value="0">
            </div>
            <div class="field">
              <label>Regalos / día a este personaje</label>
              <input type="number" id="giftsPerDay" min="1" max="3" value="3">
            </div>
            <div class="toggle">
              <input type="checkbox" id="appraiser">
              <div><strong>Perito/a</strong><span>+5% afinidad por regalo hasta nivel de bond 8</span></div>
            </div>
            <div class="toggle">
              <input type="checkbox" id="dailyAction">
              <div><strong>Acción / Salida diaria (nivel 7+)</strong><span>+200 afinidad/día fija sin coste de regalo</span></div>
            </div>
          </div>
        </div>

        <div class="block results" id="resultsBlock">
          <h2>Resultado</h2>
          <div id="resultsBody"></div>
        </div>
      </div>
    `;

    homeEl.style.display = 'none';
    detailEl.style.display = 'block';
    backBtn.style.display = 'inline-block';
    window.scrollTo(0,0);

    const curLevelSel = detailEl.querySelector('#curLevel');
    for(let l=1; l<=9; l++){
      const opt = document.createElement('option');
      opt.value = l; opt.textContent = `Nivel ${l}`;
      curLevelSel.appendChild(opt);
    }
    curLevelSel.value = 1;

    const giftSelector = detailEl.querySelector('#giftSelector');
    items.forEach(it => {
      const opt = document.createElement('option');
      opt.value = it.id;
      opt.textContent = `${it.gift} (${it.value} af. · ${it.fons ? it.fons.toLocaleString() + ' fons' : 'Especial'})`;
      giftSelector.appendChild(opt);
    });
    giftSelector.value = activeGiftId;

    const els = {
      giftSelector,
      curLevel: curLevelSel,
      curXp: detailEl.querySelector('#curXp'),
      fonsPerItem: detailEl.querySelector('#fonsPerItem'),
      giftsPerDay: detailEl.querySelector('#giftsPerDay'),
      appraiser: detailEl.querySelector('#appraiser'),
      dailyAction: detailEl.querySelector('#dailyAction'),
      giftList: detailEl.querySelector('#giftList'),
      headerSub: detailEl.querySelector('#headerSub'),
    };

    function updateFonsDefault(){
      const chosen = items.find(it => it.id === els.giftSelector.value) || items[0];
      els.fonsPerItem.value = (chosen && chosen.fons) ? chosen.fons : 0;
    }
    updateFonsDefault();

    function calculateWithGift(giftObj){
      const curLevel = parseInt(els.curLevel.value, 10);
      let curXp = Math.max(0, parseInt(els.curXp.value || '0', 10));
      const giftsPerDay = Math.max(1, parseInt(els.giftsPerDay.value || '1', 10));
      const hasAppraiser = els.appraiser.checked;
      const hasDailyAction = els.dailyAction.checked;
      const baseGiftValue = giftObj.value;

      const segmentNeed = thresholds[curLevel - 1] || 0;
      if(curXp > segmentNeed) curXp = segmentNeed;

      let segs = [];
      for(let lvl = curLevel; lvl <= 9; lvl++){
        const need = thresholds[lvl - 1];
        const already = (lvl === curLevel) ? curXp : 0;
        const remaining = Math.max(0, need - already);
        const bonusApplies = hasAppraiser && (lvl <= 8);
        const eff = bonusApplies ? Math.round(baseGiftValue * 1.05) : baseGiftValue;
        segs.push({ lvl, need, remaining, bonusApplies, eff, used: 0 });
      }

      let days = 0, itemsUsed = 0, si = 0;
      while(si < segs.length && days < 20000){
        days++;
        if(hasDailyAction && si < segs.length){
          segs[si].remaining -= 200;
          if(segs[si].remaining <= 0) si++;
        }
        let sent = 0;
        while(sent < giftsPerDay && si < segs.length){
          const s = segs[si];
          s.remaining -= s.eff;
          s.used++; itemsUsed++; sent++;
          if(s.remaining <= 0){ si++; }
        }
        if(si >= segs.length) break;
      }

      return { curLevel, segs, items: itemsUsed, days, giftsPerDay };
    }

    function render(){
      activeGiftId = els.giftSelector.value;
      const currentGift = items.find(it => it.id === activeGiftId) || items[0];
      const r = calculateWithGift(currentGift);

      els.headerSub.textContent = `Regalo activo: ${currentGift.gift} · ${currentGift.value} afinidad por unidad`;

      els.giftList.innerHTML = items.map(it => {
        const itemCalc = calculateWithGift(it);
        const isActive = it.id === activeGiftId;
        return `
          <div class="gift-row ${isActive ? 'active' : ''}" data-id="${it.id}">
            <img class="gimg" src="${it.icon}" alt="${it.gift}" referrerpolicy="no-referrer" onerror="this.src='${FALLBACK_ICON}'">
            <span class="gname">
              ${it.gift}
              <span class="gneed">${itemCalc.items.toLocaleString()} unidades necesarias · ~${itemCalc.days.toLocaleString()} días</span>
            </span>
            <span class="gval">
              +${it.value} af.
              ${it.fons ? '<br><span style="font-size:10.5px; color:var(--dim); font-weight:400;">' + it.fons.toLocaleString() + ' fons</span>' : ''}
            </span>
          </div>
        `;
      }).join('');

      els.giftList.querySelectorAll('.gift-row').forEach(row => {
        row.addEventListener('click', () => {
          els.giftSelector.value = row.dataset.id;
          updateFonsDefault();
          render();
        });
      });

      const body = detailEl.querySelector('#resultsBody');
      if(r.curLevel >= 10){
        body.innerHTML = `<div class="complete">BOND 10 ALCANZADO</div>`;
        return;
      }
      const fons = Math.max(0, parseFloat(els.fonsPerItem.value || '0'));
      const totalFons = r.items * fons;

      const rows = r.segs.map(s => `
        <tr>
          <td>${s.lvl} → ${s.lvl+1}</td>
          <td>${s.need.toLocaleString()}</td>
          <td>${s.bonusApplies ? '+5%' : '—'}</td>
          <td>${s.used.toLocaleString()}</td>
        </tr>`).join('');

      body.innerHTML = `
        <div class="big-stat">${r.items.toLocaleString()}</div>
        <div class="lbl">unidades de ${currentGift.gift}</div>
        <div class="stat3">
          <div class="cell"><div class="n">${totalFons.toLocaleString()}</div><div class="l">fons totales</div></div>
          <div class="cell"><div class="n">${r.days.toLocaleString()}</div><div class="l">días estimados</div></div>
          <div class="cell"><div class="n">${r.giftsPerDay}</div><div class="l">regalos/día</div></div>
        </div>
        <table>
          <thead><tr><th>Nivel</th><th>Afinidad</th><th>Bonus</th><th>Items</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    els.giftSelector.addEventListener('change', () => {
      updateFonsDefault();
      render();
    });

    [els.curLevel, els.curXp, els.fonsPerItem, els.giftsPerDay, els.appraiser, els.dailyAction].forEach(el => {
      el.addEventListener('input', render);
      el.addEventListener('change', render);
    });

    render();
  }

  loadData();
</script>
</body>
</html>
